name: Diagnostico do tablet

# Le o diario que o app do tablet manda (quedas e cada passo da atualizacao) e imprime no log.
# Rodar pela aba Actions ("Run workflow") ou por "gh workflow run diagnostico.yml".
# So entram dados tecnicos (versao, modelo do aparelho, passos e pilhas de erro), nada do aquario.
on:
  # empurrar um commit para o ramo "diagnostico" tambem roda (workflow_dispatch so funciona depois
  # que este arquivo estiver no main)
  push:
    branches: [diagnostico]
  workflow_dispatch:
    inputs:
      linhas:
        description: 'Quantas linhas, das mais novas'
        required: false
        default: '80'

permissions:
  contents: read

jobs:
  ler:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gzfkcryebczjmuzckxuv
      LINHAS: ${{ github.event.inputs.linhas || '80' }}
    steps:
      - name: TPA e perlon na quinta
        run: |
          q="update public.routines set dias_semana = '{4}', updated_at = now() where deleted_at is null and ativa and recorrencia = 'dias_da_semana' and dias_semana = '{5}' and ((tipo = 'tpa' and titulo not ilike '%baiacu%') or titulo ilike 'troca do perlon%') returning titulo, dias_semana::text"
          jq -n --arg q "$q" '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json; echo

      - name: Ler o diario
        continue-on-error: true
        run: |
          n=$(printf '%s' "$LINHAS" | tr -cd '0-9'); n=${n:-80}
          q="select to_char(criado_em at time zone 'America/Sao_Paulo', 'DD/MM HH24:MI:SS') as quando, versao, tipo, texto, aparelho from public.app_diagnosticos order by criado_em desc, recebido_em desc limit $n"
          jq -n --arg q "$q" '{query: $q}' > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          if [ "$code" -ge 300 ]; then echo "::error::consulta falhou (HTTP $code)"; head -c 2000 /tmp/out.json; exit 1; fi
          jq -r 'if length == 0 then "diario vazio" else (reverse | .[] | "[\(.quando)] v\(.versao) \(.tipo): \(.texto)") end' /tmp/out.json
          echo "---"
          jq -r '[.[].aparelho] | unique | .[]' /tmp/out.json

      - name: Downloads do APK (registro do Supabase, ultimas 48 h)
        continue-on-error: true
        run: |
          # Quem baixou qual APK e quando. Sem IP: so pais e programa, para separar o tablet
          # (okhttp, BR) do CI (okhttp ou Python, EUA). A mesma versao baixada varias vezes pelo
          # tablet quer dizer que a instalacao nao entrou; uma de cada, que atualizou e veio outra.
          sql="select timestamp, event_message, log_attributes['request.cf.country'] as pais from logs where source = 'edge_logs' and event_message like '%/object/public/app/%.apk%' order by timestamp asc limit 500"
          for janela in 48 24; do
            ini=$(date -u -d "-${janela} hours" +%Y-%m-%dT%H:%M:%SZ); fim=$(date -u -d "-$((janela-24)) hours" +%Y-%m-%dT%H:%M:%SZ)
            sleep 2
            curl -sS -G -o /tmp/logs.json "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" \
              --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$ini" --data-urlencode "iso_timestamp_end=$fim" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
            echo "== de $ini a $fim =="
            jq -e '.result' /tmp/logs.json >/dev/null 2>&1 || { head -c 800 /tmp/logs.json; echo; continue; }
            jq -r '.result[] | (.event_message | split(" | ")) as $p | "\(.timestamp[0:19]) UTC  \(.pais // "?")  \($p[1])  \($p[2] | sub(".*/app/"; ""))  [\($p[3] // "")]"' /tmp/logs.json
          done
