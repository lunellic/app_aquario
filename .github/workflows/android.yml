name: App Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['supabase/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cadeia de certificados dos domínios usados (diagnóstico)
        run: |
          host=$(grep '^SUPABASE_URL=' gradle.properties | sed 's#.*https://##')
          echo | openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:' || true

      - name: Keystore fixa (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luluco.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/luluco.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 não configurada: APK assinado com chave temporária (atualizar exige desinstalar antes)."
          fi

      - name: Testes e APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Nomear APK
        id: apk
        run: |
          name="luluco-reef-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: luluco-reef-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
