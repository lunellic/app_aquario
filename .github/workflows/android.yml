name: App Android

on:
  push:
    branches: [main, 'bloco-*']
    tags: ['v*']
    # Commit que nao muda o APK nao gera versao nova. Antes, guardar prints ou mexer no PWA
    # publicava um build igual com numero novo, e o tablet mostrava "atualizacao disponivel" de
    # hora em hora sem nada de novo para instalar.
    paths-ignore: ['supabase/**', '**.md', 'prints/**', 'pwa/**', '.github/workflows/pwa.yml', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Criar Release com esta tag (ex.: v0.1.0). Vazio = só compilar.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cadeia de certificados dos domínios usados (diagnóstico)
        run: |
          host=$(grep '^SUPABASE_URL=' gradle.properties | sed 's#.*https://##')
          echo | openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:' || true

      - name: Keystore fixa (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luluco.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/luluco.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 não configurada: APK assinado com chave temporária (atualizar exige desinstalar antes)."
          fi

      - name: Testes e APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Nomear APK
        id: apk
        run: |
          name="luluco-reef-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: luluco-reef-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Release versionado (tag v* ou execução manual com release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}

      # Link fixo para instalar no tablet: sempre o último build da main.
      - name: Atualizar pré-release "dev"
        if: github.ref == 'refs/heads/main'
        run: |
          cp "${{ steps.apk.outputs.name }}" luluco-reef.apk
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "Último build da main" --notes "Atualizado automaticamente a cada push."
          gh release upload dev luluco-reef.apk --clobber
          gh release edit dev --notes "Build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}), versão 0.0.${GITHUB_RUN_NUMBER}."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # Atualizacao pelo proprio app: o tablet le o versao.json e baixa o APK daqui.
      # Fica no Storage do Supabase, e nao no GitHub, porque o Fire OS 5 e de 2017 e o app ja
      # carrega as raizes de certificado que faltam para falar com o Supabase. Baixar do GitHub
      # exigiria embutir outro conjunto de raizes e torcer para nao mudarem.
      - name: Publicar a versão no Storage do Supabase
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado: atualização pelo app não publicada."
            exit 0
          fi
          KEY=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k["name"]=="service_role"), ""))')
          if [ -z "$KEY" ]; then echo "::warning::sem service_role; pulando."; exit 0; fi
          BASE="https://$PROJECT_REF.supabase.co/storage/v1"
          # Bucket publico: o APK e o mesmo que ja esta numa release publica, entao nao ha
          # segredo a proteger aqui, e exigir login para atualizar travaria justamente quem
          # precisa atualizar porque a sessao quebrou.
          curl -sS -o /dev/null -X POST "$BASE/bucket" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"id":"app","name":"app","public":true}' || true
          NOTAS=$(git log -1 --pretty=%s)
          QUANDO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TAMANHO=$(stat -c %s luluco-reef.apk)
          SHA=$(sha256sum luluco-reef.apk | cut -d' ' -f1)
          NOTAS="$NOTAS" QUANDO="$QUANDO" TAMANHO="$TAMANHO" SHA="$SHA" python3 -c 'import json,os; n=os.environ["GITHUB_RUN_NUMBER"]; print(json.dumps({"build":int(n),"versao":f"0.0.{n}","commit":os.environ["GITHUB_SHA"][:7],"quando":os.environ["QUANDO"],"notas":os.environ["NOTAS"],"apk":f"luluco-reef-{n}.apk","tamanho":int(os.environ["TAMANHO"]),"sha256":os.environ["SHA"]},ensure_ascii=False))' > versao.json
          # O app baixa uma copia com o NUMERO DO BUILD no nome. Com nome fixo, o CDN do
          # Storage podia servir o APK anterior por um tempo depois do upload: o tablet via
          # "versao 109" no versao.json, baixava em dois segundos o arquivo velho que estava no
          # cache, e o instalador reinstalava a mesma versao. Nome novo a cada build nao tem
          # cache para errar. Cache longo e imutavel, porque esse arquivo nunca muda.
          curl -sS --fail -o /dev/null -X POST "$BASE/object/app/luluco-reef-$GITHUB_RUN_NUMBER.apk" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Cache-Control: max-age=31536000, immutable" --data-binary @luluco-reef.apk
          # e a de nome fixo continua, para o link de instalar na mao
          curl -sS --fail -o /dev/null -X POST "$BASE/object/app/luluco-reef.apk" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Cache-Control: max-age=60" --data-binary @luluco-reef.apk
          # O versao.json e consultado a cada abertura do app: cache curto, senao o tablet
          # continuaria vendo o numero antigo por horas depois de a versao sair.
          curl -sS --fail -o /dev/null -X POST "$BASE/object/app/versao.json" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "x-upsert: true" \
            -H "Content-Type: application/json" -H "Cache-Control: max-age=30" \
            --data-binary @versao.json
          echo "Publicado: $(cat versao.json)"
          # Guarda so as tres ultimas copias numeradas. Cada uma tem uns 10 MB e o plano
          # gratuito do Storage tem 1 GB: sem limpar, uns cem builds enchiam o espaco.
          VELHOS=$(curl -sS -X POST "$BASE/object/list/app" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"prefix":"luluco-reef-","limit":1000}' \
            | python3 -c 'import json,re,sys; xs=[o["name"] for o in json.load(sys.stdin) if re.fullmatch(r"luluco-reef-\d+\.apk",o["name"])]; xs.sort(key=lambda n:int(re.findall(r"\d+",n)[0])); print(json.dumps(xs[:-3]))')
          if [ "$VELHOS" != "[]" ]; then
            curl -sS -o /dev/null -X DELETE "$BASE/object/app" \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
              -d "{\"prefixes\": $VELHOS}" || true
            echo "Apagados: $VELHOS"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: gzfkcryebczjmuzckxuv

      # O Lucas instala no tablet pelo Drive, sem depender do computador. Sem o segredo
      # configurado o passo nao falha o build: ele so nao envia nada.
      - name: Subir o APK no Google Drive
        if: github.ref == 'refs/heads/main'
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 tools/subir_no_drive.py luluco-reef.apk "$PASTA" \
            "Build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}), versao 0.0.${GITHUB_RUN_NUMBER}."
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PASTA: 1vSSGaG1dIcZsWPFKW5OX2GPpzbkh7uqn

  # Teste de fumaça no Android 5.1 (API 22), o mesmo do Fire HD 8: TLS real com o Supabase e fluxo principal das telas.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Keystore fixa (para o APK de teste ter a assinatura da release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luluco.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/luluco.jks" >> "$GITHUB_ENV"
          fi

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes instrumentados no emulador API 22
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 22
          arch: x86
          target: default
          profile: Nexus 7
          # Com cartao de memoria, como o Fire: o APK baixado vai para a pasta externa do app, que e
          # o caminho do tablet. Sem isto o emulador caia na pasta interna e testava outro caminho.
          sdcard-path-or-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/smoke_ci.sh

      - name: Montar as capturas de tela
        if: always()
        run: test -f capturas.log && python3 tools/extrair_prints.py capturas.log capturas || echo "sem log de capturas"

      - name: Guardar as capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_number }}
          path: capturas/
          if-no-files-found: ignore
          retention-days: 90
