name: App Android

on:
  push:
    branches: [main, 'bloco-*']
    tags: ['v*']
    paths-ignore: ['supabase/**', '**.md']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Criar Release com esta tag (ex.: v0.1.0). Vazio = só compilar.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cadeia de certificados dos domínios usados (diagnóstico)
        run: |
          host=$(grep '^SUPABASE_URL=' gradle.properties | sed 's#.*https://##')
          echo | openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:' || true

      - name: Keystore fixa (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luluco.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/luluco.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 não configurada: APK assinado com chave temporária (atualizar exige desinstalar antes)."
          fi

      - name: Testes e APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Nomear APK
        id: apk
        run: |
          name="luluco-reef-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: luluco-reef-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Release versionado (tag v* ou execução manual com release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}

      # Link fixo para instalar no tablet: sempre o último build da main.
      - name: Atualizar pré-release "dev"
        if: github.ref == 'refs/heads/main'
        run: |
          cp "${{ steps.apk.outputs.name }}" luluco-reef.apk
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "Último build da main" --notes "Atualizado automaticamente a cada push."
          gh release upload dev luluco-reef.apk --clobber
          gh release edit dev --notes "Build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}), versão 0.0.${GITHUB_RUN_NUMBER}."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
