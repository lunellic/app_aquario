name: Backend Supabase

# Aplica as migrações SQL, publica as Edge Functions, grava os secrets delas e agenda o pg_cron.
# Precisa dos GitHub Secrets: SUPABASE_ACCESS_TOKEN, ANTHROPIC_API_KEY, RESEND_API_KEY, NTFY_TOPIC.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

env:
  PROJECT_REF: gzfkcryebczjmuzckxuv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checagem de tipos e testes das regras do servidor
        working-directory: supabase/functions
        run: |
          deno check assistant/index.ts notifier/index.ts
          deno test _shared/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado: deploy pulado. Rode os SQL de supabase/migrations manualmente no SQL Editor."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            for s in ANTHROPIC_API_KEY RESEND_API_KEY NTFY_TOPIC; do
              [ -n "${!s}" ] || echo "::warning::$s não configurado: a parte que depende dele vai responder com erro até ser configurado."
            done
          fi

      - name: Aplicar migrações SQL (todas são idempotentes)
        if: steps.check.outputs.go == 'true'
        run: |
          run_sql() {
            jq -Rs '{query: .}' "$1" > /tmp/q.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
            if [ "$code" -ge 300 ]; then echo "::error::$2 falhou (HTTP $code)"; head -c 2000 /tmp/out.json; exit 1; fi
            echo "ok: $2"
          }
          for f in supabase/migrations/*.sql; do run_sql "$f" "$(basename "$f")"; done

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.go == 'true'
        with:
          version: latest

      - name: Publicar Edge Functions
        if: steps.check.outputs.go == 'true'
        run: |
          supabase functions deploy assistant --project-ref "$PROJECT_REF" --yes
          supabase functions deploy notifier --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Gravar secrets das funções e agendar o cron
        if: steps.check.outputs.go == 'true'
        run: |
          CRON_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$CRON_SECRET"
          {
            echo "CRON_SECRET=$CRON_SECRET"
            [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY=$RESEND_API_KEY"
            [ -n "$NTFY_TOPIC" ] && echo "NTFY_TOPIC=$NTFY_TOPIC"
            echo "ANTHROPIC_MODEL=claude-haiku-5-5"
          } > /tmp/fn.env
          supabase secrets set --project-ref "$PROJECT_REF" --env-file /tmp/fn.env --yes
          rm -f /tmp/fn.env
          sed -e "s#__FUNCTIONS_URL__#https://$PROJECT_REF.supabase.co/functions/v1#g" -e "s#__CRON_SECRET__#$CRON_SECRET#g" supabase/cron.sql > /tmp/cron.sql
          jq -Rs '{query: .}' /tmp/cron.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/q.json)
          rm -f /tmp/cron.sql /tmp/q.json
          if [ "$code" -ge 300 ]; then echo "::error::agendamento do cron falhou (HTTP $code)"; head -c 2000 /tmp/out.json; exit 1; fi
          echo "cron agendado"
