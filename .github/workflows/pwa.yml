name: PWA iPhone

# Publica a pasta pwa/ no GitHub Pages.
# UMA VEZ, a mao: Settings > Pages > Source: "GitHub Actions". Sem isso o passo configure-pages
# falha com "Get Pages site failed", porque o token do Actions nao pode criar o site sozinho.
# Depois disso o app fica em https://lunellic.github.io/app_aquario/ e atualiza a cada push em pwa/.

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez, e o mais novo espera o anterior terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar no Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os arquivos
        run: |
          set -e
          for f in index.html ui.js app.js graficos.js financas.js relatorios.js style.css config.js manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png; do
            test -s "pwa/$f" || { echo "faltando ou vazio: pwa/$f"; exit 1; }
          done
          # o manifest tem que ser JSON valido, senao o iPhone nao oferece "Adicionar à Tela de Início"
          python3 -c "import json; json.load(open('pwa/manifest.webmanifest'))"
          # a config precisa ter a URL e a chave de verdade
          grep -q "https://.*supabase.co" pwa/config.js || { echo "config.js sem a URL do Supabase"; exit 1; }
          grep -q "sb_publishable" pwa/config.js || { echo "config.js sem a chave publicavel"; exit 1; }
          echo "ok"

      - name: Verificar a sintaxe do JavaScript
        run: |
          for f in pwa/*.js; do node --check "$f"; done

      # O token do Actions nao tem permissao para criar o site do Pages (tentado e recusado em 22/11).
      # Entao o Pages precisa ser ligado uma vez a mao: Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - id: deploy
        uses: actions/deploy-pages@v4
